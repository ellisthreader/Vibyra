name: Linux installed release and live updater proof
on:
  workflow_call:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      artifact_name:
        type: string
        default: ""
      version:
        required: true
        type: string
      live_update:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      artifact_run_id:
        type: string
        default: ""
      artifact_name:
        type: string
        default: ""
      version:
        description: Exact published version to verify
        default: '0.8.10'
        required: true
      live_update:
        description: Upgrade the older shipped package through the real production updater
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: ${{ matrix.os }} ${{ matrix.bundle }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        bundle: [appimage, deb]
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_VERSION: ${{ inputs.version }}
      LIVE_UPDATE: ${{ inputs.live_update }}
      BUNDLE: ${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - run: bash desktop-tauri/scripts/setup-linux.sh --ci
      - run: cargo install tauri-driver --locked --version 2.0.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.artifact_run_id
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Download and install the exact signed release package
        shell: bash
        run: |
          [[ "$TARGET_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$TARGET_VERSION"
          if [[ "$BUNDLE" == appimage ]]; then
            suffix=x86_64.AppImage
            if [[ "$LIVE_UPDATE" == true ]]; then version=0.8.7; fi
          else
            suffix=amd64.deb
            if [[ "$LIVE_UPDATE" == true ]]; then version=0.8.9; fi
          fi
          package="Vibyra-Desktop-$version-$suffix"
          if [[ ! -f "candidate/$package" ]]; then
            gh release download "v$version" --pattern "$package" --dir candidate
          fi
          if [[ "$BUNDLE" == deb ]]; then
            sudo apt-get install -y "$PWD/candidate/$package"
            echo "APPLICATION=/usr/bin/Vibyra" >> "$GITHUB_ENV"
          else
            echo "APPLICATION=$PWD/candidate/$package" >> "$GITHUB_ENV"
          fi
      - name: Exercise the production signed updater and reopen
        if: inputs.live_update
        working-directory: desktop-tauri
        run: >-
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24"
          node scripts/smoke-linux-update.mjs "$APPLICATION" "$TARGET_VERSION" release/update-proof
      - name: Verify typing in the reopened installed version in Balanced mode
        working-directory: desktop-tauri
        env:
          VIBYRA_SMOKE_EXPECT_VERSION: ${{ inputs.version }}
          VIBYRA_SMOKE_PERFORMANCE: balanced
        run: >-
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24"
          node scripts/smoke-linux-terminal.mjs "$APPLICATION" release/typing-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-proof-${{ matrix.os }}-${{ matrix.bundle }}-${{ inputs.live_update }}
          path: desktop-tauri/release/
          if-no-files-found: warn
          retention-days: 14
