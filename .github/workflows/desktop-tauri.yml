name: Tauri desktop CI

on:
  pull_request:
    paths:
      - "desktop-tauri/**"
      - "host/**"
      - "mobile/src/**"
      - "mobile/tsconfig.json"
      - "mobile/package*.json"
      - ".github/workflows/desktop-frontend.yml"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/desktop-macos-release.yml"
      - "scripts/check-desktop-lines.mjs"
      - ".github/workflows/desktop-tauri.yml"
  push:
    branches: [main]
    paths:
      - "desktop-tauri/**"
      - "host/**"
      - "mobile/src/**"
      - "mobile/tsconfig.json"
      - "mobile/package*.json"
      - ".github/workflows/desktop-frontend.yml"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/desktop-macos-release.yml"
      - "scripts/check-desktop-lines.mjs"
      - ".github/workflows/desktop-tauri.yml"
  workflow_dispatch:
    inputs:
      compact_packages:
        description: Losslessly compress an existing Linux release artifact
        type: boolean
        default: false
      installed_version:
        description: Verify a published Linux release instead of building
        type: string
        default: ""
      live_update:
        description: Exercise the production updater from older Linux packages
        type: boolean
        default: false
      linux_only:
        description: Validate and package only the Linux candidate
        type: boolean
        default: false
      artifact_run_id:
        description: Reuse a Linux candidate artifact for terminal paint diagnostics
        type: string
        default: ""
      artifact_name:
        description: Artifact name from that run
        type: string
        default: ""
      compatibility_renderer:
        description: Use WebKit's compatibility renderer for a reused AppImage
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: tauri-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compact-packages:
    if: ${{ inputs.compact_packages && inputs.artifact_run_id }}
    uses: ./.github/workflows/desktop-linux-compact.yml
    secrets: inherit
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      artifact_name: ${{ inputs.artifact_name }}
  installed-release:
    if: ${{ inputs.installed_version }}
    uses: ./.github/workflows/desktop-linux-update-proof.yml
    with:
      version: ${{ inputs.installed_version }}
      live_update: ${{ inputs.live_update }}
      artifact_run_id: ${{ inputs.artifact_run_id }}
      artifact_name: ${{ inputs.artifact_name }}
  agent-command-sandbox:
    if: ${{ !inputs.artifact_run_id && !inputs.installed_version }}
    name: Mac Agent command sandbox proof
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Verify the signed product XPC helper in a disposable app
        run: python3 desktop-tauri/scripts/verify-agent-command-helper.py

  verify:
    if: ${{ !inputs.artifact_run_id && !inputs.installed_version }}
    name: Frontend, native, and policy gates
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - name: Install Linux desktop build dependencies
        run: bash desktop-tauri/scripts/setup-linux.sh --ci
      - name: Install pinned Rust toolchain
        working-directory: desktop-tauri
        run: rustup show active-toolchain
      - name: Install locked frontend dependencies
        run: npm ci --prefix desktop-tauri
      - name: Install locked shared conversation dependencies
        run: npm ci --prefix mobile
      - name: Install locked Preview fixture dependencies
        run: npm ci --prefix host/relay
      - name: Enforce desktop source limits
        run: node scripts/check-desktop-lines.mjs
      - name: Check dead code and dependency declarations
        run: npm --prefix desktop-tauri run check:dead-code
      - name: Run frontend tests
        run: npm --prefix desktop-tauri test
      - name: Typecheck and build frontend
        run: npm --prefix desktop-tauri run build
      - name: Check Rust formatting
        run: npm --prefix desktop-tauri run rust:fmt
      - name: Lint all Rust targets
        run: npm --prefix desktop-tauri run rust:clippy
      - name: Run all Rust tests
        run: npm --prefix desktop-tauri run rust:test

      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: npm --prefix desktop-tauri run rust:audit
      - name: Verify encrypted embedded phone transport
        run: cargo test --manifest-path host/Cargo.toml -p vibyra-host --no-default-features --lib --locked
      - name: Record the frontend embedded in the Linux candidate
        working-directory: desktop-tauri
        run: node scripts/frontend-artifact.mjs create
      - name: Build and verify the unsigned Linux candidate AppImage
        working-directory: desktop-tauri
        run: >-
          npm run app:build:linux -- --config
          '{"bundle":{"createUpdaterArtifacts":false},"build":{"beforeBuildCommand":"node scripts/frontend-artifact.mjs verify"}}'
      - name: Install pinned native Linux WebDriver
        working-directory: desktop-tauri
        run: cargo install tauri-driver --locked --version 2.0.6
      - name: Exercise the actual Linux AppImage and capture its frontend
        working-directory: desktop-tauri
        run: |
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" = 1
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" node scripts/smoke-linux.mjs "${images[0]}"
      - name: Inspect native Linux terminal paint
        if: ${{ inputs.linux_only }}
        working-directory: desktop-tauri
        run: |
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" node scripts/smoke-linux-terminal.mjs "${images[0]}" release/linux-terminal-smoke
      - name: Preserve Linux package, frontend manifest and native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibyra-linux-candidate-${{ github.sha }}
          path: |
            desktop-tauri/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop-tauri/release/frontend-manifest.json
            desktop-tauri/release/linux-smoke/
            desktop-tauri/release/linux-terminal-smoke/
          if-no-files-found: warn
          retention-days: 14

  windows:
    if: ${{ !inputs.linux_only && !inputs.artifact_run_id && !inputs.installed_version }}
    name: Windows native gates
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - name: Install pinned Rust toolchain
        working-directory: desktop-tauri
        run: rustup show active-toolchain
      - name: Install locked frontend dependencies
        run: npm ci --prefix desktop-tauri
      - name: Install locked shared conversation dependencies
        run: npm ci --prefix mobile
      - name: Install locked Preview fixture dependencies
        run: npm ci --prefix host/relay
      # The Linux job cannot compile the `cfg(target_os = "windows")` branches
      # at all, so a Windows-only regression there stays invisible until a user
      # hits it. Lint and test the native crate on a real Windows runner.
      - name: Lint all Rust targets
        run: npm --prefix desktop-tauri run rust:clippy
      - name: Run all Rust tests
        run: npm --prefix desktop-tauri run rust:test

  terminal-paint:
    if: ${{ inputs.artifact_run_id && !inputs.installed_version && !inputs.compact_packages }}
    name: Linux terminal paint (${{ matrix.performance }}, ${{ matrix.renderer }})
    strategy:
      fail-fast: false
      matrix:
        performance: [balanced, full, best]
        renderer: [auto, compatibility]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Install Linux runtime and WebDriver dependencies
        run: bash desktop-tauri/scripts/setup-linux.sh --ci
      - name: Install pinned native Linux WebDriver
        run: cargo install tauri-driver --locked --version 2.0.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Capture real terminal typing and paint
        env:
          VIBYRA_SMOKE_PERFORMANCE: ${{ matrix.performance }}
        working-directory: desktop-tauri
        run: |
          mapfile -t images < <(find ../candidate -name "*.AppImage" -type f)
          test "${#images[@]}" = 1
          if [[ "${{ inputs.compatibility_renderer }}" == "true" || "${{ matrix.renderer }}" == "compatibility" ]]; then export VIBYRA_WEBKIT_DMABUF=0; fi
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" node scripts/smoke-linux-terminal.mjs "${images[0]}" release/linux-terminal-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-terminal-paint-${{ matrix.performance }}-${{ matrix.renderer }}-${{ github.sha }}
          path: desktop-tauri/release/linux-terminal-smoke/
          if-no-files-found: warn
          retention-days: 14
