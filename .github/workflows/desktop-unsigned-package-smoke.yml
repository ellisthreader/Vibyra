name: Desktop unsigned package smoke (review only)

on:
  push:
    branches:
      - codex/desktop-package-smoke-f00e4391-20260927

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.label }} unsigned package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows NSIS
            command: app:build:windows
            source: src-tauri/target/release/bundle/nsis/*-setup.exe
            suffix: windows-nsis-unsigned.exe
          - os: ubuntu-22.04
            label: Linux AppImage
            command: app:build:linux
            source: src-tauri/target/release/bundle/appimage/*.AppImage
            suffix: linux-appimage-unsigned.AppImage
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - name: Check out exact review branch without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prove application source equals PR 33
        shell: bash
        run: |
          for tree in desktop-tauri mobile host backend; do
            expected=$(git rev-parse "f00e4391d82acdb40e6a4907288d3ca87a4f9040:$tree")
            actual=$(git rev-parse "HEAD:$tree")
            test "$expected" = "$actual"
            echo "$tree tree SHA: $actual"
          done
          echo "Source commit: f00e4391d82acdb40e6a4907288d3ca87a4f9040"
          echo "Workflow commit: $GITHUB_SHA"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - name: Install Linux package and launch dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential curl file libayatana-appindicator3-dev libdbus-1-dev
          librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget xvfb
      - name: Install locked dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix ../mobile
          npm ci --prefix ../host/relay
          rustup show active-toolchain
      - name: Build package without updater artifacts or signing secrets
        shell: bash
        env:
          CARGO_INCREMENTAL: "0"
        run: npm run ${{ matrix.command }} -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Stage one unsigned test package and hash
        id: stage
        shell: bash
        run: |
          shopt -s nullglob
          matches=( ${{ matrix.source }} )
          test "${#matches[@]}" = 1
          test ! -e "${matches[0]}.sig"
          mkdir -p unsigned-test-package
          output="Vibyra-0.8.11-${{ matrix.suffix }}"
          cp "${matches[0]}" "unsigned-test-package/$output"
          sha256sum "unsigned-test-package/$output" > "unsigned-test-package/$output.sha256"
          echo "name=$output" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.label }} build-only candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "App source: \`f00e4391d82acdb40e6a4907288d3ca87a4f9040\`; workflow: \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned test artifact; no updater signature or production release." >> "$GITHUB_STEP_SUMMARY"
          echo "$(wc -c < "unsigned-test-package/$output") bytes; SHA-256 $(cut -d' ' -f1 < "unsigned-test-package/$output.sha256")" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test Linux AppImage launch on ephemeral runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          artifact="unsigned-test-package/${{ steps.stage.outputs.name }}"
          chmod +x "$artifact"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$artifact" &
          pid=$!
          sleep 12
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
      - name: Smoke-test Windows NSIS install and app launch on ephemeral runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "unsigned-test-package/${{ steps.stage.outputs.name }}"
          $install = Start-Process $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $app = Get-ChildItem $env:LOCALAPPDATA -Recurse -Include 'Vibyra.exe','vibyra-desktop.exe' -File |
            Where-Object { $_.FullName -match 'Vibyra' } | Select-Object -First 1
          if (-not $app) { throw 'Vibyra executable was not installed.' }
          $process = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "Vibyra exited with $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Upload internal unsigned review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibyra-${{ matrix.suffix }}-${{ github.sha }}
          path: desktop-tauri/unsigned-test-package/*
          if-no-files-found: error
          retention-days: 7
