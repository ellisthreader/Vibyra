name: Owner dashboard

on:
  pull_request:
    paths:
      - 'backend/resources/js/portal/**'
      - 'backend/resources/css/portal/**'
      - 'backend/resources/css/portal.css'
      - 'backend/preview/**'
      - 'backend/package*.json'
      - 'backend/app/**'
      - 'backend/bootstrap/**'
      - 'backend/routes/**'
      - 'backend/database/**'
      - 'backend/tests/**'
      - 'backend/composer.*'
      - '.github/workflows/owner-dashboard.yml'
  push:
    branches: ['codex/owner-dashboard-redesign-20261012']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check:owner
      - run: npm run build

  account-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vibyra_owner_qa_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-qa-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_pgsql, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: python3 preview/checkOwnerBackend.py
      - run: python3 preview/checkOwnerBackend.py --postgres
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vibyra_owner_qa_ci
          DB_USERNAME: postgres
          DB_PASSWORD: local-qa-only
          DB_URL: ''
          OWNER_POSTGRES_QA: '1'
