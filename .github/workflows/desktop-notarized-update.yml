name: Sign notarized Mac updater bytes

on:
  workflow_call:
    inputs:
      notarized_source_commit:
        description: Full frozen source SHA of the successful native build
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      NOTARIZED_SOURCE_COMMIT: ${{ inputs.notarized_source_commit }}
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked signing tools
        run: npm ci
      - name: Test rejection of tampering and unsafe archives
        run: |
          python3 scripts/test-notarized-updaters.py
          python3 scripts/test-notarized-source.py
      - name: Require an explicit frozen app source
        run: python3 -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}", os.environ["NOTARIZED_SOURCE_COMMIT"])'
      - name: Download the exact reviewed notarized release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "remote-notarized-$NOTARIZED_SOURCE_COMMIT"
          --repo "$GITHUB_REPOSITORY" --dir release
          --pattern notarized-manifest.json --pattern 'Vibyra-Desktop-*.app.tar.gz'
      - name: Verify provenance, archive bounds and Apple acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-notarized-updaters.py release
      - name: Sign final bytes with the existing updater key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          for archive in release/*.app.tar.gz; do
            npm exec -- tauri signer sign "$archive"
          done
      - name: Verify final updater signatures and unchanged hashes
        run: node scripts/verify-notarized-signatures.mjs release
      - name: Preserve final signed archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibyra-notarized-updaters-${{ inputs.notarized_source_commit }}
          path: |
            desktop-tauri/release/*.app.tar.gz
            desktop-tauri/release/*.app.tar.gz.sig
            desktop-tauri/release/notarized-manifest.json
          if-no-files-found: error
          retention-days: 30
