name: Linux terminal paint diagnostic

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Run that uploaded the Linux AppImage candidate
        required: true
        type: string
      artifact_name:
        description: Linux candidate artifact name
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  terminal:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Install Linux runtime and WebDriver dependencies
        run: bash desktop-tauri/scripts/setup-linux.sh --ci
      - name: Install pinned native Linux WebDriver
        run: cargo install tauri-driver --locked --version 2.0.6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: candidate
      - name: Capture real terminal typing and paint
        working-directory: desktop-tauri
        run: |
          images=(../candidate/src-tauri/target/release/bundle/appimage/*.AppImage)
          test "${#images[@]}" = 1
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" node scripts/smoke-linux-terminal.mjs "${images[0]}" release/linux-terminal-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-terminal-paint-${{ github.sha }}
          path: desktop-tauri/release/linux-terminal-smoke/
          if-no-files-found: warn
          retention-days: 14
