name: Rust desktop beta packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight:
    name: Verify release version and updater feed
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Verify package and Tauri versions agree
        run: node scripts/verify-release.mjs version
      - name: Require a current release candidate and healthy updater feed
        run: node scripts/verify-release.mjs feed

  package:
    name: ${{ matrix.label }} Rust package
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundle: windows
            command: npm run app:build:windows
            source: src-tauri/target/release/bundle/nsis/*-setup.exe
            suffix: x64-setup.exe
          - os: ubuntu-22.04
            label: Linux
            bundle: appimage
            command: npm run app:build:linux
            source: src-tauri/target/release/bundle/appimage/*.AppImage
            suffix: x86_64.AppImage
          - os: ubuntu-22.04
            label: Linux Deb
            bundle: deb
            command: npm run app:build:deb
            source: src-tauri/target/release/bundle/deb/*.deb
            suffix: amd64.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json
      - name: Install Linux build and smoke-test dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential curl file libayatana-appindicator3-dev libdbus-1-dev
          librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget xvfb
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Confirm pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run release gates
        run: npm run verify
      - name: Verify and read the version being released
        id: version
        shell: bash
        run: |
          # A drift here creates a package whose UI and native updater disagree
          # about which release is installed.
          version=$(node scripts/verify-release.mjs version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "output=Vibyra-Desktop-$version-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Build native package
        run: ${{ matrix.command }}
        env:
          # Without these the bundler silently skips the .sig files and the
          # release cannot be offered as an in-app update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Stage versioned artifact, checksum and update signature
        shell: bash
        run: |
          mkdir -p release
          output="${{ steps.version.outputs.output }}"
          shopt -s nullglob
          matches=( ${{ matrix.source }} )
          test "${#matches[@]}" = 1
          test -s "${matches[0]}"
          test -s "${matches[0]}.sig"
          cp "${matches[0]}" "release/$output"
          sha256sum "release/$output" > "release/$output.sha256"
          # The updater refuses an unsigned package, so a missing .sig here is
          # a failed release, not a warning.
          cp "${matches[0]}.sig" "release/$output.sig"
          node scripts/verify-release.mjs artifact "${{ matrix.bundle }}" "release/$output"
      - name: Smoke-test Linux AppImage launch
        if: matrix.bundle == 'appimage'
        shell: bash
        run: |
          artifact="release/${{ steps.version.outputs.output }}"
          chmod +x "$artifact"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "$artifact" &
          pid=$!
          sleep 12
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
      - name: Smoke-test Debian package install and app launch
        if: matrix.bundle == 'deb'
        shell: bash
        run: |
          artifact="$PWD/release/${{ steps.version.outputs.output }}"
          extract_dir=$(mktemp -d)
          trap 'rm -rf "$extract_dir"' EXIT
          dpkg-deb -x "$artifact" "$extract_dir"
          mapfile -t binaries < <(find "$extract_dir/usr/bin" -maxdepth 1 -type f -perm /111 -print)
          test "${#binaries[@]}" = 1
          binary="/${binaries[0]#"$extract_dir/"}"
          printf 'Debian package executable: %s\n' "$binary"
          sudo apt-get install -y "$artifact"
          test -x "$binary"
          xvfb-run -a "$binary" &
          pid=$!
          sleep 12
          kill -0 "$pid"
          kill "$pid"
          wait "$pid" || true
      - name: Smoke-test Windows installer and app launch
        if: matrix.bundle == 'windows'
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "release/${{ steps.version.outputs.output }}"
          $install = Start-Process $installer -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          $binaryName = (Get-Content 'src-tauri/tauri.conf.json' | ConvertFrom-Json).mainBinaryName + '.exe'
          $app = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter $binaryName |
            Select-Object -First 1
          if (-not $app) { throw "The installed $binaryName executable was not found." }
          $process = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) { throw "Vibyra exited with $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - name: Summarise the values needed to publish this release
        shell: bash
        run: |
          output="${{ steps.version.outputs.output }}"
          {
            echo "### ${{ matrix.label }} — Vibyra ${{ steps.version.outputs.version }}"
            echo
            echo "Set these on the backend, then upload \`$output\` to the release volume:"
            echo
            echo '```'
            echo "VERSION=${{ steps.version.outputs.version }}"
            echo "FILENAME=$output"
            echo "SIZE=$(wc -c < "release/$output")"
            echo "SHA256=$(cut -d' ' -f1 < "release/$output.sha256")"
            echo "SIGNATURE=$(cat "release/$output.sig")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibyra-rust-beta-${{ matrix.label }}-${{ github.sha }}
          path: |
            desktop-tauri/release/${{ steps.version.outputs.output }}
            desktop-tauri/release/${{ steps.version.outputs.output }}.sha256
            desktop-tauri/release/${{ steps.version.outputs.output }}.sig
            desktop-tauri/release/${{ steps.version.outputs.output }}.metadata.json
          if-no-files-found: error
          retention-days: 30

  verify-release-set:
    name: Verify complete signed release set and updater feed
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2
      - name: Download every matrix artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vibyra-rust-beta-*-${{ github.sha }}
          path: desktop-tauri/release-set
      - name: Verify all packages, checksums, signatures and metadata
        run: node scripts/verify-release.mjs set release-set
      - name: Smoke-test the configured live updater contract
        run: node scripts/verify-release.mjs feed
      - name: Record the safe publication boundary
        shell: bash
        run: |
          {
            echo "### Signed desktop release set verified"
            echo
            echo "Windows NSIS, Linux AppImage and Debian artifacts are present with matching checksums, signatures and metadata."
            echo
            echo "The configured feed offered a signed update to an old client and returned 204 for this release candidate and a future client on all three routes."
            echo
            echo "No files were published to the live release volume."
          } >> "$GITHUB_STEP_SUMMARY"
