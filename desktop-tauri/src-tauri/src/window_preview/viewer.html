<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Application Preview</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}body{margin:0;background:#0d0e12;color:#eef0f7;font:14px -apple-system,system-ui;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
main{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#screen{width:100%;height:100%;object-fit:contain;display:block;cursor:pointer;touch-action:none;-webkit-touch-callout:none;-webkit-user-drag:none;transform-origin:0 0;transition:transform .18s ease-out}
#screen.live{transition:none}
#state{position:fixed;top:10px;left:10px;margin:0;padding:5px 10px 5px 22px;border-radius:999px;background:rgba(18,20,26,.72);font-size:12px;font-weight:600;transition:opacity .6s}
#state::before{content:"";position:absolute;left:10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#35d07f}
#state.quiet{opacity:0}#state.paused::before{background:#ff9c6b}
#problem{position:fixed;left:10px;right:10px;top:44px;margin:0;padding:10px 12px;border-radius:12px;background:rgba(60,28,20,.9);color:#ffd2bd}
#problem:empty{display:none}
#turn{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:rgba(26,28,36,.94);box-shadow:0 8px 30px rgba(0,0,0,.45)}
#turn p{margin:0;flex:1;line-height:1.35}#turn strong{display:block;font-size:15px}#turn span{color:#a9adbb;font-size:12.5px}
.phone{position:relative;width:26px;height:42px;flex:none;margin:6px 10px}
.phone i{position:absolute;inset:0;border:2.5px solid #eef0f7;border-radius:6px;animation:turn 2.8s ease-in-out infinite}
.phone i::after{content:"";position:absolute;left:50%;bottom:3px;width:8px;height:2px;margin-left:-4px;border-radius:2px;background:#eef0f7}
.phone b{position:absolute;left:-12px;top:-10px;width:48px;height:48px;border:2px solid transparent;border-top-color:#6aa6ff;border-radius:50%;animation:arc 2.8s ease-in-out infinite}
@keyframes turn{0%,18%{transform:rotate(0)}45%,72%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@keyframes arc{0%,18%{opacity:0;transform:rotate(40deg)}35%{opacity:1}45%,100%{opacity:0;transform:rotate(-60deg)}}
.icon{flex:none;width:34px;height:34px;border:0;border-radius:50%;background:rgba(255,255,255,.08);color:#eef0f7;font-size:17px;line-height:34px;padding:0}
.sink{position:fixed;top:0;left:0;width:1px;height:1px;margin:0;padding:0;border:0;opacity:.01;font-size:16px;color:transparent;background:transparent;caret-color:transparent;resize:none;pointer-events:none;-webkit-user-select:text;user-select:text}
#typeHint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 18px;border:0;border-radius:999px;background:#2f6fed;color:#fff;font:600 15px -apple-system,system-ui;box-shadow:0 6px 24px rgba(0,0,0,.45);white-space:nowrap}
.tap{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:2px solid #6aa6ff;pointer-events:none;animation:tap .45s ease-out forwards}
@keyframes tap{from{transform:scale(.3);opacity:1}to{transform:scale(1.3);opacity:0}}
@media (orientation:landscape){#turn{display:none}}
#controls{position:fixed;left:0;top:0;z-index:5;width:48px;height:48px;padding:0;border:0;border-radius:50%;background:#4667E8;color:#fff;box-shadow:0 5px 12px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;touch-action:none}
#controls svg{width:23px;height:23px}svg{display:block}
#sheet{position:fixed;inset:0;z-index:10}#sheetBackdrop{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .21s}#sheet.open #sheetBackdrop{opacity:.38}
#panel{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - 24px);overflow-y:auto;padding:12px 18px calc(max(env(safe-area-inset-bottom),14px) + 12px);border-radius:28px 28px 0 0;background:#13151A;box-shadow:0 -6px 18px rgba(0,0,0,.15);transform:translateY(100%);transition:transform .21s ease-out}
#sheet.open #panel{transform:none}.grabber{width:36px;height:5px;margin:0 auto 19px;border-radius:3px;background:#A6ADBA;opacity:.4}
.head{display:flex;align-items:flex-start;gap:12px}.head div{flex:1;min-width:0}#panel h2{margin:0;color:#F5F7FA;font-size:19px;font-weight:700;letter-spacing:-.4px}
#sheetLocation{margin:3px 0 19px;color:#A6ADBA;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done{padding:4px 2px;border:0;background:none;color:#5B7CFA;font:600 15px -apple-system,system-ui}
.label{margin:0 4px 8px;color:#A6ADBA;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.group{margin-bottom:14px;overflow:hidden;border:.5px solid #2B2F38;border-radius:17px;background:#181A20}.rule{height:.5px;margin-left:56px;background:#2B2F38}
.row{width:100%;min-height:54px;display:flex;align-items:center;gap:12px;padding:0 12px;border:0;background:none;color:#F5F7FA;font:600 15px -apple-system,system-ui;text-align:left}
.row:disabled{opacity:.4}.row:active{opacity:.6}.row span{flex:1}.row em{color:#A6ADBA;font-size:13px;font-style:normal}
.ico{flex:none;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#20232A}.ico svg{width:20px;height:20px}.chev{width:16px;height:16px;color:#A6ADBA}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px}.keys button{height:44px;display:flex;align-items:center;justify-content:center;border:0;border-radius:10px;background:#20232A;color:#F5F7FA;font:600 14px -apple-system,system-ui}
.keys button svg{width:20px;height:20px}.keys button.sent{background:#4667E8}
.zoom{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;padding:12px}.zoom button{height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:#20232A;color:#F5F7FA;font:600 15px -apple-system,system-ui}
.zoom button:disabled{opacity:.4}.zoom svg{width:20px;height:20px}.zoom small{color:#A6ADBA;font-size:13px}
#closePreview{width:100%;min-height:54px;display:flex;align-items:center;justify-content:center;gap:9px;border:.5px solid #2B2F38;border-radius:17px;background:#181A20;color:#F06472;font:600 15px -apple-system,system-ui}#closePreview svg{width:20px;height:20px}
