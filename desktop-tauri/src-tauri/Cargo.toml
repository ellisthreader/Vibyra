[workspace]
members = ["crates/vibyra-core"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
thiserror = "2"
# Agent Mode's durable store. `bundled` compiles SQLite itself rather than
# linking whatever the build host happens to ship, so the WAL/foreign-key
# behaviour the migrations rely on is the same on every platform we release.
rusqlite = { version = "0.40", features = ["bundled"] }
# Routine schedules are civil-time rules ("09:00 on weekdays"), so the next
# run has to be resolved through a real timezone database or it drifts an hour
# twice a year. chrono-tz carries the IANA rules; chrono applies them.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "v7"] }
# The approval broker's fingerprint. A 32-bit non-cryptographic hash is fine
# for noticing that a terminal screen changed; it is not fine for a token that
# authorises spending money, where a collision is the whole attack.
sha2 = "0.10"

[package]
name = "vibyra-desktop"
version = "0.1.0"
description = "Vibyra Desktop — AI terminal workspace"
authors = ["Vibyra"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "vibyra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
tempfile = "3"
# The exact verifier `tauri-plugin-updater` uses, so this crate proves the
# shipped public key against a real signature rather than a lookalike.
minisign-verify = "0.2"
base64 = "0.22"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
vibyra-core = { path = "crates/vibyra-core" }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart", "json"] }
getrandom = "0.3"
tokio = { version = "1", default-features = false, features = ["time"] }
chrono = { workspace = true }
arboard = { version = "3.6", features = ["wayland-data-control"] }
# Only the `system` feature: disks, networks, components and users are all
# extra probes we never read. Pinned to 0.38, which declares MSRV 1.88 to match
# this crate; 0.39 requires 1.95 and would raise ours.
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service"] }
raw-window-handle = "0.6"
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
