[package]
name = "vibyra-core"
version = "0.1.0"
description = "Vibyra Desktop native core: PTY sessions, output batching, agent registry, filesystem services. No UI-toolkit dependencies."
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
portable-pty = "0.9"
notify = "8"
notify-debouncer-full = "0.5"
dirs = "6"
libc = "0.2"
rusqlite = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
