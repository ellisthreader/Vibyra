[package]
name = "vibyra-host-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
vibyra-core = { path = "../../../desktop-tauri/src-tauri/crates/vibyra-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
cap-std = "4"
libc = "0.2"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }

[dev-dependencies]
tempfile = "3"
