[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "nodejs_22"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction", "npm ci", "npm install -g @railway/cli"]

[phases.build]
cmds = ["npm run build", "php artisan config:clear", "php artisan route:clear"]

[start]
cmd = "bash scripts/start-production.sh"
