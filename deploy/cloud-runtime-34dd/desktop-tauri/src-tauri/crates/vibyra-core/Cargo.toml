[package]
name = "vibyra-core"
version = "0.1.0"
description = "Vibyra Desktop native core: PTY sessions, output batching, agent registry, filesystem services. No UI-toolkit dependencies."
edition = "2021"
rust-version = "1.88"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
portable-pty = "0.9"
notify = "8"
notify-debouncer-full = "0.5"
dirs = "6"
libc = "0.2"
sha2 = "0.10"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
